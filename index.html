<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atividade de Biologia — Grupos</title><meta name="description" content="Atividade prática de Biologia da turma INF1A: consulte os grupos e suas receitas."><meta property="og:title" content="Atividade Prática de Biologia — INF1A"><meta property="og:description" content="Consulte os grupos e receitas da atividade prática de Biologia."><meta property="og:type" content="website"><meta property="og:image" content="https://guilherme-augusto-inf.github.io/Receitas-INF1A-02/public/og.svg"><link rel="icon" href="public/favicon.svg"><link rel="stylesheet" href="public/styles.css?v=3"></head><body><header class="top"><a href="./">🧬 Biologia — Atividade Prática</a><span id="nav"></span></header><main class="wrap"><p class="muted">ATIVIDADE PRÁTICA • INF1A</p><h1>Atividade Prática de Biologia</h1><p class="muted">Explore os grupos, conheça os temas e consulte ou edite as receitas da turma.</p><div id="account"></div><section id="groups" class="grid"><div class="panel">⏳ Carregando grupos...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public/supabase.js?v=3"></script><script src="public/auth.js?v=3"></script><script src="public/theme.js?v=3"></script><script src="public/effects.js?v=3"></script><script>(async()=>{const nav=document.querySelector('#nav'),groups=document.querySelector('#groups'),account=document.querySelector('#account'),me=await BioAuth.profile();if(me.user){nav.innerHTML='<a class="btn" href="perfil/">Perfil</a>'+(me.profile?.role==='teacher'?' <a class="btn" href="professor/">Painel</a>':'')+' <button class="btn secondary" id="logout">Sair</button>';document.querySelector('#logout').onclick=()=>BioAuth.signOut();if(me.profile?.is_anonymous&&!me.profile.group_id)account.innerHTML='<p class="status reveal">Conta anônima criada. Você poderá editar somente depois que o professor atribuir seu grupo.</p>'}else nav.innerHTML='<a class="btn" href="login/">Entrar</a>';const r=await sb.from('groups').select('name,slug,description').order('slug');if(r.error){groups.innerHTML='<div class="panel error">Erro ao carregar grupos: '+r.error.message+'</div>';return}groups.innerHTML=(r.data||[]).map((g,i)=>'<article class="card reveal" style="--reveal-delay:'+(i*80)+'ms"><p class="muted">'+g.slug.replace('-',' ').toUpperCase()+'</p><h2>'+String(g.name).replace(/^Grupo \d+ — /,'')+'</h2><p class="muted">'+(g.description||'Tema da atividade')+'</p><a class="btn" href="'+encodeURI(g.slug)+'/">Abrir grupo</a></article>').join('')||'<div class="panel">Nenhum grupo cadastrado.</div>';if(window.BioEffects)window.BioEffects.observe()})();</script></body></html>
