<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atividade de Biologia — INF1A</title><meta name="description" content="Atividade prática de Biologia da turma INF1A."><meta property="og:title" content="Atividade Prática de Biologia — INF1A"><meta property="og:description" content="Consulte os grupos e acompanhe a atividade prática de Biologia."><meta property="og:type" content="website"><meta property="og:image" content="https://guilherme-augusto-inf.github.io/Receitas-INF1A-02/public/og.svg"><link rel="icon" href="public/favicon.svg"><link rel="stylesheet" href="public/styles.css?v=4"></head><body><header class="top"><a href="./">🧬 Biologia — INF1A</a><span id="nav"></span><span class="clock-inline">🇧🇷 <span data-brasilia-clock>--:--:--</span></span></header><main class="wrap"><section class="hero panel reveal is-visible"><div><p class="muted">ATIVIDADE PRÁTICA • INF1A</p><h1>Atividade Prática de Biologia</h1><p class="hero-copy">Entre no seu grupo, acompanhe o trabalho e registre o resultado da atividade.</p></div><div class="hero-dna">🧬</div></section><div id="account"></div><div id="class-announcement"></div><section class="panel reveal"><div class="section-head"><div><p class="muted">ACOMPANHAMENTO</p><h2>Como está a turma?</h2></div><span class="muted">Atualização ao abrir a página</span></div><div id="class-progress" class="class-progress-grid"></div></section><section><div class="section-head"><div><p class="muted">SEU GRUPO</p><h2>Escolha um grupo</h2></div></div><section id="groups" class="grid"><div class="panel">⏳ Carregando grupos...</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public/supabase.js?v=4"></script><script src="public/auth.js?v=4"></script><script src="public/theme.js?v=4"></script><script src="public/effects.js?v=4"></script><script src="public/classroom.js?v=1"></script><script>(async()=>{const nav=document.querySelector('#nav'),groups=document.querySelector('#groups'),account=document.querySelector('#account'),progress=document.querySelector('#class-progress'),me=await BioAuth.profile();if(me.user){nav.innerHTML='<a class="btn" href="perfil/">Perfil</a>'+(me.profile?.role==='teacher'?' <a class="btn" href="professor/">Painel</a>':'')+' <button class="btn secondary" id="logout">Sair</button>';document.querySelector('#logout').onclick=()=>BioAuth.signOut();if(me.profile?.is_anonymous&&!me.profile.group_id)account.innerHTML='<p class="status reveal is-visible">Conta anônima criada. O professor precisa organizar seu grupo antes da edição.</p>'}else nav.innerHTML='<a class="btn" href="login/">Entrar</a>';const r=await sb.rpc('get_group_overview');if(r.error){groups.innerHTML='<div class="panel error">Erro ao carregar grupos: '+r.error.message+'</div>';progress.innerHTML='<p class="muted">O acompanhamento ainda não está disponível.</p>';return}const data=r.data||[],labels={not_started:['⚪','Não iniciados'],in_progress:['🔵','Em andamento'],review:['🟡','Em revisão'],completed:['🟢','Finalizados']},counts={not_started:0,in_progress:0,review:0,completed:0};data.forEach(g=>counts[g.activity_status]++);progress.innerHTML=Object.entries(labels).map(([k,v])=>'<div class="progress-item"><span>'+v[0]+'</span><strong>'+counts[k]+'</strong><small>'+v[1]+'</small></div>').join('');groups.innerHTML=data.map((g,i)=>'<article class="card reveal" style="--reveal-delay:'+(i*80)+'ms">'+(g.photo_url?'<img class="group-cover" src="'+String(g.photo_url).replace(/"/g,'&quot;')+'" alt="Foto do grupo">':'<div class="group-cover placeholder">🧬</div>')+'<p class="muted">'+String(g.slug).replace('-',' ').toUpperCase()+'</p><div class="section-head"><h2>'+String(g.name).replace(/^Grupo \d+ — /,'')+'</h2><span class="status-pill status-'+g.activity_status+'">'+labels[g.activity_status][0]+' '+labels[g.activity_status][1]+'</span></div><p class="muted">'+(g.description||'Tema da atividade')+'</p><div class="mini-stats"><span>👥 '+g.member_count+'</span><span>📝 '+g.recipe_count+'</span></div><a class="btn" href="'+encodeURI(g.slug)+'/">Abrir grupo</a></article>').join('')||'<div class="panel">Nenhum grupo cadastrado.</div>';if(window.BioEffects)window.BioEffects.observe()})();</script></body></html>
